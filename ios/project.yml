# XcodeGen spec for Mnet iOS. Regenerate the project with:
#   xcodegen --spec ios/project.yml --project ios
# Generation/build does not register bundle IDs or authorize signing.
# CI uses unsigned simulator builds with provisioning disabled.
name: Mnet
options:
  bundleIdPrefix: au.fintex
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: $(MNET_BUILD_NUMBER)
    MARKETING_VERSION: 0.5.0
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Mnet:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: MnetApp.swift
      - path: TunnelManagerPolicy.swift
      - path: EnrollmentPreferences.swift
      - path: StatusReadGate.swift
    dependencies:
      - target: MnetTunnel
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.fintex.mnet
        PRODUCT_MODULE_NAME: MnetApp
        INFOPLIST_FILE: Mnet-Info.plist
  MnetTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnelProvider.swift
      - path: TunnelLifecycle.swift
      - path: PacketFlowBuffer.swift
      - path: Flow.swift
    dependencies:
      - framework: Mnet.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.fintex.mnet.tunnel
        INFOPLIST_FILE: MnetTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: MnetTunnel.entitlements

schemes:
  Mnet:
    build:
      targets:
        Mnet: all
