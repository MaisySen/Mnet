name: android-emulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator.yml'
      - 'android/instrumentation/**'
      - 'android/app/**'
      - 'mobile/**'
      - 'cmd/mnetd/native_peer_test.go'
      - 'scripts/android-emulator-validation.py'
  workflow_dispatch:

# This is engineering instrumentation, not a release or Play Protect verdict.
permissions:
  contents: read

concurrency:
  group: android-emulator-fixture
  cancel-in-progress: false

jobs:
  actual-vpn-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    env:
      MNET_ANDROID_API: ${{ matrix.api }}
      MNET_ANDROID_COMPILE_API: 36
      MNET_ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: use one explicit disposable AVD directory
        run: |
          mkdir -p "$RUNNER_TEMP/mnet-avd"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/mnet-avd" >> "$GITHUB_ENV"
      - name: install pinned Android fixture toolchain
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' "system-images;android-${MNET_ANDROID_API};google_apis;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name mnet-fixture --package "system-images;android-${MNET_ANDROID_API};google_apis;x86_64" --device 'pixel_2' --path "$ANDROID_AVD_HOME/mnet-fixture.avd"
          test -s "$ANDROID_AVD_HOME/mnet-fixture.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'mnet-fixture'
      - name: enable standard Linux KVM access
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: build current shared engine and isolated real peer
        run: |
          mobile_version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@$mobile_version"
          go install "golang.org/x/mobile/cmd/gobind@$mobile_version"
          gomobile init
          mkdir -p "$RUNNER_TEMP/mnet-android-bin"
          CGO_LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" gomobile bind -target android/amd64 -androidapi 24 -o "$RUNNER_TEMP/mnet-android-fixture.aar" fintex.au/mnet/mobile
          go build -o "$RUNNER_TEMP/mnet-android-bin/mnet-control" ./cmd/mnet-control
          go test -c -o "$RUNNER_TEMP/mnet-android-bin/native-peer" ./cmd/mnetd
      - name: install walkthrough encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
      - name: actual APK and JNI VPN hash round trip, stop and reconnect
        env:
          MNET_ANDROID_AAR: ${{ runner.temp }}/mnet-android-fixture.aar
          MNET_ANDROID_BIN: ${{ runner.temp }}/mnet-android-bin
          MNET_ANDROID_ARTIFACTS: ${{ runner.temp }}/mnet-android-artifacts
        run: python3 scripts/android-emulator-validation.py
      - name: retain allowlisted non-secret diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-proof-api${{ matrix.api }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/mnet-android-artifacts/summary.json
            ${{ runner.temp }}/mnet-android-artifacts/instrumentation.txt
            ${{ runner.temp }}/mnet-android-artifacts/launch.png
            ${{ runner.temp }}/mnet-android-artifacts/privacy.png
            ${{ runner.temp }}/mnet-android-artifacts/vpn-disclosure.png
            ${{ runner.temp }}/mnet-android-artifacts/consent.png
            ${{ runner.temp }}/mnet-android-artifacts/consent.mp4
