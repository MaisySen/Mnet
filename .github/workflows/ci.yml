name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: read-only Linux saved-state systemd unit verification
        run: |
          go test -race -count=3 ./cmd/mnetd -run 'TestLinuxService|TestUnixDaemonState'
          go build -o "$RUNNER_TEMP/mnetd-unit" ./cmd/mnetd
          "$RUNNER_TEMP/mnetd-unit" -state /var/lib/mnet-fixture -service print-unit > "$RUNNER_TEMP/mnetd.service"
          systemd-analyze verify "$RUNNER_TEMP/mnetd.service"
          python3 scripts/check-linux-unit.py "$RUNNER_TEMP/mnetd-unit"
          python3 scripts/check-daemon-ownership.py "$RUNNER_TEMP/mnetd-unit"
      - name: cross-compile Windows and Darwin daemons
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...
      - name: vet
        run: go vet ./...
      - name: known vulnerability scan
        run: go tool govulncheck ./...
      - name: test with race detector
        run: go test -race -count=1 -timeout=5m ./...
      - name: bounded untrusted session and STUN parser fuzzing
        run: |
          go test -run '^$' -fuzz '^FuzzFrameDecoder$' -fuzztime=10s -parallel=2 ./internal/session
          go test -run '^$' -fuzz '^FuzzParseResponse$' -fuzztime=10s -parallel=2 ./internal/stun
      - name: metadata trace and OS TCP race isolation (30 repetitions)
        run: go test -race -count=30 -timeout=3m ./internal/session -run 'TestFrameTraceBoundedMetadataOnly|TestTrace|TestSessionOverTCP'
      - name: userspace mesh file burst regression (100 transfers)
        run: MNET_MESH_STRESS=1 go test -race -count=1 -timeout=2m ./cmd/mnetd -run '^TestMeshFileStress$'
      - name: proof-only userspace burst loss recovery
        run: MNET_MESH_STRESS=1 MNET_MESH_LOSS=burst go test -race -count=1 -timeout=2m ./cmd/mnetd -run '^TestMeshFileStress$'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: android/framework-tests/pom.xml
      - name: Android startup configuration policy (JVM only)
        run: |
          mkdir -p "$RUNNER_TEMP/mnet-android-policy"
          javac -d "$RUNNER_TEMP/mnet-android-policy" android/app/src/main/java/au/fintex/mnet/VpnStartupConfig.java android/tests/au/fintex/mnet/VpnStartupConfigTest.java android/app/src/main/java/au/fintex/mnet/VpnWorkerGate.java android/tests/au/fintex/mnet/VpnWorkerGateTest.java
          java -cp "$RUNNER_TEMP/mnet-android-policy" au.fintex.mnet.VpnStartupConfigTest
          java -cp "$RUNNER_TEMP/mnet-android-policy" au.fintex.mnet.VpnWorkerGateTest
          javac -d "$RUNNER_TEMP/mnet-android-policy" android/app/src/main/java/au/fintex/mnet/ViewerGate.java android/tests/au/fintex/mnet/ViewerGateTest.java
          java -cp "$RUNNER_TEMP/mnet-android-policy" au.fintex.mnet.ViewerGateTest
          javac -d "$RUNNER_TEMP/mnet-android-policy" android/app/src/main/java/au/fintex/mnet/SessionConsent.java android/tests/au/fintex/mnet/SessionConsentTest.java
          java -cp "$RUNNER_TEMP/mnet-android-policy" au.fintex.mnet.SessionConsentTest
          javac -d "$RUNNER_TEMP/mnet-android-policy" android/app/src/main/java/au/fintex/mnet/SessionControl.java android/tests/au/fintex/mnet/SessionControlTest.java
          java -cp "$RUNNER_TEMP/mnet-android-policy" au.fintex.mnet.SessionControlTest
          javac -d "$RUNNER_TEMP/mnet-android-policy" android/app/src/main/java/au/fintex/mnet/ViewerTap.java android/tests/au/fintex/mnet/ViewerTapTest.java
          java -cp "$RUNNER_TEMP/mnet-android-policy" au.fintex.mnet.ViewerTapTest
      - name: Android selected-service framework simulation (no device/JNI)
        run: sh scripts/test-android-framework.sh
      - name: Android actual-resource native-raster layout fixtures (no emulator/JNI)
        env:
          MNET_LAYOUT_OUTPUT: ${{ runner.temp }}/mnet-layout-pixels
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          sh scripts/render-android-layouts.sh
      - name: retain non-secret synthetic layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-layout-previews
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/mnet-layout-pixels/*.png
      - name: Android VPN service framework simulation (fake system mode and node)
        run: sh scripts/test-android-framework.sh vpn
      - name: Android always-on mode policy (JVM fakes and source only)
        run: python3 scripts/test-android-always-on.py
      - name: Android bundle signature gate regression
        run: python3 scripts/test-android-aab-signature.py
      - name: Android native page layout guard tests
        run: python3 scripts/test-android-native-pages.py
      - name: isolated manual control acceptance safety checks
        run: python3 scripts/test-android-control-acceptance.py
      - name: Android emulator fixture safety checks
        run: python3 scripts/test-android-emulator-fixture.py
      - name: Android private-identity backup policy (source XML only)
        run: python3 scripts/test-android-backup-policy.py
      - name: Android API compatibility matrix (JVM fakes and source only)
        run: python3 scripts/test-android-api-compat.py
      - name: Android projection stop policy (JVM fakes and source only)
        run: python3 scripts/test-android-projection.py
      - name: Android viewer lifecycle wiring (source only)
        run: python3 scripts/check-android-viewer-lifecycle.py
      - name: Android VPN fixed-log policy (source checks only)
        run: python3 scripts/check-android-vpn-logs.py
      - name: source gate regression tests
        run: python3 scripts/test-source-gate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: consumer journey prototype model and browser simulation
        run: |
          node --test scripts/chrome-pipe-diagnostics.test.mjs
          node --test prototype/model.test.mjs
          node prototype/verify.mjs
      - name: isolated real Chrome admin login and logout
        run: |
          node --test scripts/fixture-process.test.mjs scripts/chrome-startup-diagnostics.test.mjs
          node scripts/dashboard-validation.mjs
      - name: isolated real Chrome member account login and logout
        run: MNET_ACCOUNT_BROWSER=1 go test -race -count=1 -timeout=2m ./internal/control -run '^TestAccountRealChrome$'
      - name: secrets and style gate
        run: sh scripts/check-secrets.sh

  session-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install isolated X11 proof dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils x11-utils zenity xdotool imagemagick python3-pil
      - name: live session proof against a local control plane
        run: sh scripts/session-validation.sh
      - name: attended Linux local approval and reserved live-stop (disposable X11)
        run: |
          python3 scripts/attended-x11-validation.py
          MNET_ATTENDED_DISPLAY_SIZE=2048x1536x24 python3 scripts/attended-x11-validation.py
          python3 scripts/attended-process-validation.py
      - name: native view-only client and attended host (two disposable X11 displays)
        run: |
          python3 scripts/native-viewer-validation.py
          MNET_VIEWER_DISPLAY_SIZE=2048x1536x24 python3 scripts/native-viewer-validation.py
      - name: independent Shared Desk TLS pair and native input (two disposable X11 displays)
        run: |
          python3 scripts/desk-native-validation.py
          MNET_DESK_TARGET_SIZE=1280x960x24 python3 scripts/desk-native-validation.py
      - name: actual one-run Shared Desk engineering CLI processes (two disposable X11 displays)
        run: |
          python3 scripts/desk-launch-validation.py
          MNET_DESK_TARGET_SIZE=1280x960x24 python3 scripts/desk-launch-validation.py
      - name: retain failed proof diagnostics (no credentials or node state)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-failure-diagnostics
          retention-days: 7
          path: |
            /tmp/mnet-session.*/proof.log
            /tmp/mnet-session.*/proof/summary.json
            /tmp/mnet-session.*/xvfb.log
            /tmp/mnet-session.*/swap.log
            /tmp/mnet-attended-x11.*/test.log
            /tmp/mnet-attended-x11.*/safety.log
            /tmp/mnet-recipient-guardian.*/*.stdout
            /tmp/mnet-recipient-guardian.*/*.stderr
            /tmp/mnet-attended-x11.*/*.png
            /tmp/mnet-native-viewer.*/test.log
            /tmp/mnet-native-viewer.*/*/test.log
            /tmp/mnet-native-viewer.*/*/viewer.log
            /tmp/mnet-native-viewer.*/*/*.png
            /tmp/mnet-desk-launch.*/*.log
            /tmp/mnet-desk-launch.*/launch-review-*.png
            /tmp/mnet-desk-native.*/test.log
            /tmp/mnet-desk-native.*/*-held.png
            /tmp/mnet-desk-native.*/source-return.png
            /tmp/mnet-desk-native.*/review-*.png
            /tmp/mnet-desk-native.*/*-xvfb.log

  native-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: native build
        run: go build ./...
      - name: native private state and local API lifecycle
        run: go test -race -count=1 -timeout=5m ./internal/privatefs ./internal/localapi
      - name: native CLI bounded readiness wait and owned EOF cancellation
        run: |
          go test -race -count=3 -timeout=5m ./cmd/mnet
          go test -race -count=30 -timeout=3m ./cmd/mnet -run '^TestCLIRun'
      - name: native account-session scope and revocation boundary
        run: go test -race -count=3 -timeout=5m ./internal/control -run 'TestAccountSession|TestAccountHTTP|TestAccountLoginState|TestAdminMembership|TestAccountLogout|TestAccountNewLogin|TestAccountCallbackSession|TestOIDCProviderReplacementRetires|TestOIDCApprovalRequires|TestOIDCStateBounds'
      - name: native exact local Up request and lifecycle admission
        run: go test -race -count=3 -timeout=3m ./internal/daemon -run '^TestLocalUp|^TestLocalAPI'
      - name: native forwarded DNS TCP fallback (loopback only)
        run: go test -race -count=3 -timeout=3m ./internal/dns -run '^TestForwarded|^TestEphemeralSetup'
      - name: native control-client credential redirect refusal
        run: go test -race -count=3 -timeout=5m ./internal/controlclient
      - name: native control-state private file and shape checks
        run: go test -race -count=3 -timeout=5m ./internal/control -run 'TestControlState|TestStoreRejectsNullShape|TestOldObjectState|TestACLRequest|TestACLPolicy|TestJoinKeyEncoding|TestRejoinRequiresSavedNodeCredential|TestExpiredRejoinNeedsFreshEnrollmentAuthorization'
      - name: native identity persistence and in-memory WireGuard IPC
        run: go test -race -count=1 -timeout=5m ./internal/daemon -run 'TestPrivateStateAtomicRoundTrip|TestStateRefusesLinkedIdentity|TestStateRejectsBrokenIdentity|TestStateRejectsIncompleteEnrollment|TestStateGeneratedIdentityReload|TestIdentityGenerationFailedSave|TestRoutingFailedSave|TestStartupConfigFailedSave|TestPendingApprovalURLNotLogged|TestJoinIncompleteCredential|TestJoinAcceptedCredential|TestEnrolledJoinTarget|TestFreshJoinTarget|TestStatsReadsActualDeviceIPC|TestParseWireGuardPeerStats|TestEndpointRouteFilter|TestCandidatesCannotRecurseIntoMeshOrAdvertisedRoutes'
      - name: native local key expiry and daemon restart
        run: go test -race -count=3 -timeout=5m ./internal/daemon -run 'TestMapAuthorizationDenialWithdrawsAndRecovers|TestApplyMapRejectsExpiredAuthorization|TestLocalExpiryWithoutControlResponse|TestExpiryGuardRenewsAndWakesFromNoDeadline|TestExpiryEqualityAndNoDeadlineCompatibility|TestDaemonExpiryWithBlockedControlAndRestart|TestStatusWaitsForMapApplicationBeforeSnapshot|TestReapprovedMapRestoresRunningStatus|TestSuccessfulRetryClearsPreviousError|TestUnsupportedRoutingFailsBeforeControlOrDevice|TestPrepareSerializesIdentityAndPublishesStatus|TestDownCancelsBlockedPrepare'
      - name: native permanent node disposal and startup cancellation
        run: go test -race -count=10 -timeout=3m ./internal/daemon -run '^TestClosedNode|^TestClose|^TestPendingTunnel|^TestDownReleasesPending'
      - name: native OS TCP session and file transfer
        run: |
          go test -race -count=3 -timeout=5m ./internal/session -run 'TestImageToRGBA|TestKeepalive|TestViewerControlCallback|TestSessionOverTCP|TestQueuedFileSeesStartupOptions|TestRepeatedFileTransfersReleaseStreams|TestFrameTraceBoundedMetadataOnly|TestTrace|TestOwnedFile|TestSendFileSource'
          go test -race -count=30 -timeout=3m ./internal/session -run '^TestFileReceiverClosed|^TestFileReceiverCloseAt|^TestRecv|^TestMuxClose|^TestHostTerminal|^TestMuxInbound|^TestOpenPreflight'
      - name: native mobile and headless session ownership (loopback only)
        run: |
          go test -race -count=30 -timeout=3m ./mobile -run '^TestSession'
          go test -race -count=30 -timeout=3m ./cmd/mnetd -run '^TestSessionHostOwner'
      - name: native macOS read-only launchd plist generation and syntax
        if: runner.os == 'macOS'
        run: |
          go test -race -count=10 -timeout=3m ./internal/daemon -run 'TestKernelInterfaceName|TestActualInterfaceStatus|TestStartDeviceFailureClearsInterfaceStatus|TestManagedDarwinInterfaceValidation|TestDarwinInvalidManagedInterfaceBeforeState'
          go test -race -count=10 -timeout=3m ./cmd/mnetd -run '^TestDarwinServicePlist'
          go build -o "$RUNNER_TEMP/mnetd-plist" ./cmd/mnetd
          python3 scripts/check-darwin-plist.py "$RUNNER_TEMP/mnetd-plist"
      - name: iOS app manager policy and SDK source typecheck (no signing or runtime)
        if: runner.os == 'macOS'
        run: sh scripts/test-ios-source.sh
      - name: shared production SwiftUI layout pixels (macOS renderer, no iOS runtime)
        if: runner.os == 'macOS'
        env:
          MNET_SWIFTUI_OUTPUT: ${{ runner.temp }}/mnet-swiftui-pixels
        run: sh scripts/render-swiftui-layouts.sh
      - name: retain synthetic shared-component SwiftUI pixels
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-component-previews
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/mnet-swiftui-pixels/*.png
      - name: unsigned iOS simulator app and embedded tunnel Go linkage (no launch/signing)
        if: runner.os == 'macOS'
        run: sh scripts/test-ios-linked-build.sh
      - name: native macOS state ownership and actual-process duplicate/crash release
        if: runner.os == 'macOS'
        run: |
          go test -race -count=30 -timeout=3m ./cmd/mnetd -run '^TestUnixDaemonState'
          python3 scripts/check-daemon-ownership.py "$RUNNER_TEMP/mnetd-plist"
      - name: native macOS actual launchd offline lifecycle (disposable runner)
        if: runner.os == 'macOS'
        run: sudo env GITHUB_ACTIONS=true python3 scripts/darwin-launchd-validation.py "$RUNNER_TEMP/mnetd-plist"
      - name: native macOS actual kernel utun saved-state setup and cleanup
        if: runner.os == 'macOS'
        run: |
          go build -o "$RUNNER_TEMP/mnet-control-native" ./cmd/mnet-control
          go build -o "$RUNNER_TEMP/mnet-cli-native" ./cmd/mnet
          go test -c -o "$RUNNER_TEMP/mnet-native-peer" ./cmd/mnetd
          sudo env GITHUB_ACTIONS=true python3 scripts/darwin-tun-validation.py "$RUNNER_TEMP/mnetd-plist" "$RUNNER_TEMP/mnet-control-native" "$RUNNER_TEMP/mnet-native-peer" "$RUNNER_TEMP/mnet-cli-native"
      - name: native macOS automatic default utun kernel lifecycle
        if: runner.os == 'macOS'
        run: sudo env GITHUB_ACTIONS=true MNET_AUTO_UTUN=1 python3 scripts/darwin-tun-validation.py "$RUNNER_TEMP/mnetd-plist" "$RUNNER_TEMP/mnet-control-native" "$RUNNER_TEMP/mnet-native-peer" "$RUNNER_TEMP/mnet-cli-native"
      - name: native macOS daemon clean-stop listener teardown (30 repetitions)
        if: runner.os == 'macOS'
        run: go test -race -count=30 -timeout=3m ./cmd/mnetd -run '^TestDaemonCleanStopWaitsForLocalAPITeardown$'
      - name: native Windows SCM lifecycle (offline fixture, no Wintun)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/mnetd-scm.exe" ./cmd/mnetd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-service-validation.ps1 -BinaryPath "$env:RUNNER_TEMP/mnetd-scm.exe"

  kernel-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install kernel fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping iptables
      - name: build native daemons
        run: |
          mkdir -p "$RUNNER_TEMP/mnet-kernel-bin"
          go build -o "$RUNNER_TEMP/mnet-kernel-bin/mnet-control" ./cmd/mnet-control
          go build -o "$RUNNER_TEMP/mnet-kernel-bin/mnetd" ./cmd/mnetd
          go build -o "$RUNNER_TEMP/mnet-kernel-bin/mnet" ./cmd/mnet
      - name: actual kernel TUN and OS TCP under loss, then teardown (three fresh runs)
        run: |
          for attempt in 1 2 3; do
            echo "Kernel fixture run $attempt of 3"
            systemd=0
            if [ "$attempt" = 1 ]; then systemd=1; fi
            sudo env MNET_KERNEL_SYSTEMD="$systemd" MNET_KERNEL_BIN="$RUNNER_TEMP/mnet-kernel-bin" python3 scripts/kernel-vpn-validation.py
          done
