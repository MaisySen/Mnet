name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mnet-ios-testflight-apple-read-only
  cancel-in-progress: false

jobs:
  apple-preflight:
    if: github.repository == 'MaisySen/Mnet' && github.ref == 'refs/heads/fix/mnet-testflight-apple-check-20261119' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact metadata-only branch
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 'c634e12c2908089073d651e225c3eff5d52d2401'
          diff -u <(printf '%s\n' .github/workflows/ios.yml scripts/mnet-testflight-metadata.py) <(git diff --name-only HEAD^ HEAD)
      - name: Read exact Mnet app visibility with the configured Apple key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        shell: bash
        run: |
          set -eu
          umask 077
          python3 -I -B scripts/mnet-testflight-metadata.py
