name: android-control-acceptance

# Manual-only, single selected acceptance matrix. Not the closed DNS fixture.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-control-acceptance
  cancel-in-progress: false

jobs:
  attended-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    env:
      MNET_CONTROL_API: ${{ matrix.api }}
      MNET_ANDROID_COMPILE_API: 36
      MNET_ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: use one explicit disposable AVD directory
        run: |
          mkdir -p "$RUNNER_TEMP/mnet-avd"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/mnet-avd" >> "$GITHUB_ENV"
      - name: install pinned Android fixture toolchain
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' "system-images;android-${MNET_CONTROL_API};google_apis;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name mnet-control --package "system-images;android-${MNET_CONTROL_API};google_apis;x86_64" --device 'pixel_2' --path "$ANDROID_AVD_HOME/mnet-control.avd"
          test -s "$ANDROID_AVD_HOME/mnet-control.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'mnet-control'
      - name: enable standard Linux KVM access
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: build current shared engine and isolated real peer
        run: |
          mobile_version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@$mobile_version"
          go install "golang.org/x/mobile/cmd/gobind@$mobile_version"
          gomobile init
          mkdir -p "$RUNNER_TEMP/mnet-android-bin"
          CGO_LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" gomobile bind -target android/amd64 -androidapi 24 -o "$RUNNER_TEMP/mnet-android-fixture.aar" fintex.au/mnet/mobile
          go build -o "$RUNNER_TEMP/mnet-android-bin/mnet-control" ./cmd/mnet-control
          go test -c -o "$RUNNER_TEMP/mnet-android-bin/control-peer" ./cmd/mnetd
      - name: one bounded native attended-control acceptance attempt
        env:
          MNET_CONTROL_AAR: ${{ runner.temp }}/mnet-android-fixture.aar
          MNET_CONTROL_BIN: ${{ runner.temp }}/mnet-android-bin
          MNET_CONTROL_ARTIFACTS: ${{ runner.temp }}/mnet-control-artifacts
        run: python3 scripts/android-control-acceptance.py
      - name: retain allowlisted non-secret diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-acceptance-api${{ matrix.api }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/mnet-control-artifacts/summary.json
            ${{ runner.temp }}/mnet-control-artifacts/host-view-only.png
            ${{ runner.temp }}/mnet-control-artifacts/host-decline.png
            ${{ runner.temp }}/mnet-control-artifacts/host-allow.png
            ${{ runner.temp }}/mnet-control-artifacts/host-paused.png
            ${{ runner.temp }}/mnet-control-artifacts/host-revoked.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-available.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-pending.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-declined.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-allowed.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-paused.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-revoked.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-unsupported.png
            ${{ runner.temp }}/mnet-control-artifacts/viewer-large-font.png
