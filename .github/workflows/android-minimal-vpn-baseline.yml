name: android-minimal-vpn-baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-minimal-vpn-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-minimal-vpn-baseline
  cancel-in-progress: false
jobs:
  isolated-direct-responder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: same disposable image family and target36 toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' "system-images;android-${{ matrix.api }};google_apis;x86_64"
          mkdir -p "$RUNNER_TEMP/mnet-baseline-avd"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mnet-baseline-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name mnet-baseline --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device 'pixel_2' --path "$ANDROID_AVD_HOME/mnet-baseline.avd"
      - name: standard disposable KVM access
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: minimal direct VPN initial and reconnect across two app UIDs
        env:
          MNET_BASELINE_OUTPUT: ${{ runner.temp }}/mnet-baseline-result
        run: python3 scripts/android-minimal-vpn-baseline.py
      - name: retain only fixed derived baseline result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-minimal-vpn-baseline-api${{ matrix.api }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/mnet-baseline-result/report.json
